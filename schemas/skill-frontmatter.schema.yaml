$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.com/schemas/skill.yaml
title: Agent Skill Frontmatter
description: Core metadata schema for a universal agent skill.
type: object
required:
  - name
  - version
  - description
  - author
  - license
  - status
  - tags
properties:
  name:
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    description: Unique kebab-case skill name.
  version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
    description: Semantic version.
  description:
    type: string
    minLength: 1
    description: Short capability description.
  author:
    type: string
    description: Author or organization.
  license:
    type: string
    description: License identifier.
  status:
    type: string
    enum:
      - stable
      - beta
      - alpha
      - experimental
      - deprecated
    description: Maturity status.
  tags:
    type: array
    items:
      type: string
    description: Tags for discovery.
  created:
    type: string
    format: date
    description: Creation date.
  updated:
    type: string
    format: date
    description: Last updated date.
  compatibility:
    type: array
    items:
      type: string
    description: Compatible platforms or runtimes.
  dependencies:
    type: array
    items:
      type: string
    description: External dependencies.
  risk_level:
    type: string
    description: Risk classification.
  input_types:
    type: array
    items:
      type: string
    description: Accepted input types.
  output_types:
    type: array
    items:
      type: string
    description: Produced output types.
additionalProperties: false
